# Vale config for EASIFEM docs. Used by scripts/lint-prose.sh, which
# copies it into a cache directory as .vale.ini next to the styles.
StylesPath = styles
MinAlertLevel = suggestion
Packages = write-good, Readability

[*.md]
BasedOnStyles = write-good, EASIFEM
write-good.E-Prime = NO
write-good.TooWordy = NO
write-good.Illusions = NO
write-good.Weasel = NO
write-good.Cliches = NO
Readability.FleschReadingEase = suggestion
